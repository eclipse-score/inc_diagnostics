#
# Configuration of the ECUs of the ECU simulator of the classic diagnostic adapter (CDA),
# testcontainer/ecu-sim in the CDA repository. These are the settings that the integration tests of
# the CDA make for them (integration-tests/tests/util/config.rs), and nothing else: everything not
# listed is the default of the CDA. Paths, address and port are not part of it. A consumer
# appends this file to its own configuration, which must not define these tables itself.

# The database of TMCC3000 has no logical functional address.
[com_params.doip.logical_functional_address]
value = 0xFFFF

# Reconnect fast to the simulator, also when its database says otherwise.
[com_params.doip.connection_retry_delay]
precedence = "Config"

[com_params.doip.connection_retry_delay.value]
secs = 1
nanos = 0

[faults]
# Routine 0x31 0x01 0x4200 clears the user defined DTCs.
user_defined_dtc_clear_service = [0x31, 0x01, 0x42, 0x00]
user_memory_scope = "Development"

# HOVR4000 has a DoIP protocol layer that the database names DMC_DoIP.
[ecu.hovr4000]
protocol = "DMC_DoIP"
ignore_protocol = false

[ecu.hovr4000.com_params.doip.logical_gateway_address]
name = "logical_gateway_address"
precedence = "Config"
value = 0x4000

# The databases of TMCC3000 and JGWT5000 have no protocol layer.
[ecu.jgwt5000]
ignore_protocol = true

[ecu.jgwt5000.com_params.doip.logical_gateway_address]
name = "logical_gateway_address"
precedence = "Config"
value = 0x5000

[ecu.tmcc3000]
ignore_protocol = true

[ecu.tmcc3000.com_params.doip.logical_gateway_address]
name = "logical_gateway_address"
precedence = "Config"
value = 0x3000
