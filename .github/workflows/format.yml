name: Formatting checks
permissions:
  contents: read
  actions: write
on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
jobs:
  formatting-check:
    uses: eclipse-score/cicd-workflows/.github/workflows/format.yml@f77ed751fa587e3a1142b2d85320917e00c888ae
    with:
      bazel-target: "test --config=score_diag_x86_64_linux --test_output=errors //:format.check"
