name: Bazel Build (Linux)

permissions:
  contents: read
  actions: write

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

jobs:
  linux-build:
    name: Build & test on host for target platform x86_64-linux
    runs-on: ubuntu-24.04
    env:
      BAZEL_BUILD_TARGETS: //examples/... //tests/... //score/...
      BAZEL_TEST_TARGETS: //examples/... //tests/... //score/...

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Bazel Cache
        uses: eclipse-score/cicd-actions/setup-bazel-cache@e2a2a587a759b681632040ec1e1294015a0405f5
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            liblzma-dev \
            libssl-dev \
            pkg-config

      - name: Bazel Build
        run: |
          read -r -a targets <<< "${BAZEL_BUILD_TARGETS}"

          bazel build --config=score_diag_x86_64_linux -- "${targets[@]}"

      - name: Bazel Test
        run: |
          read -r -a targets <<< "${BAZEL_TEST_TARGETS}"

          bazel test --config=score_diag_x86_64_linux -- "${targets[@]}"
