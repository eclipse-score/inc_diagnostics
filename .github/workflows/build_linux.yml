name: Bazel Build (Linux)

permissions:
  contents: read
  actions: write

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Build & test on host for target platform x86_64-linux
    runs-on: ubuntu-24.04
    env:
      BAZEL_BUILD_TARGETS: //examples/... //tests/... //score/...
      BAZEL_TEST_TARGETS: //examples/... //tests/... //score/...

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Bazel Cache
        uses: eclipse-score/cicd-actions/setup-bazel-cache@e2a2a587a759b681632040ec1e1294015a0405f5
        with:
          disk-cache-key: ${{ github.workflow }}-${{ github.job }}

      - name: Verify -Werror on main-repository compile actions
        run: |
          # Fails if -Werror is missing from this repository's C++ compiles, or if it leaks into
          # external repositories (e.g. because the ^ anchor in .bazelrc was dropped).
          werror() {
            bazel aquery --config=score_diag_x86_64_linux --output=jsonproto "mnemonic(\"CppCompile\", $1)" \
              | jq -e "(.actions | length > 0) and ([.actions[].arguments | index(\"-Werror\") != null] | $2)"
          }
          werror //score/mw/diag/uds:negative_response_code all \
            || { echo "-Werror missing on main-repository compile actions"; exit 1; }
          werror @score_baselibs//score/result:result 'any | not' \
            || { echo "-Werror applied to external repository compile actions"; exit 1; }

      - name: Bazel Build
        run: |
          read -r -a targets <<< "${BAZEL_BUILD_TARGETS}"

          bazel build --config=score_diag_x86_64_linux -- "${targets[@]}"

      - name: Bazel Test
        run: |
          read -r -a targets <<< "${BAZEL_TEST_TARGETS}"

          bazel test --config=score_diag_x86_64_linux -- "${targets[@]}"
