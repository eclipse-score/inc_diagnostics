name: CodeQL static analysis (advisory)

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  codeql-static-analysis:
    name: CodeQL static analysis (non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Bazel cache
        uses: eclipse-score/cicd-actions/setup-bazel-cache@e2a2a587a759b681632040ec1e1294015a0405f5
        with:
          unique-cache-name: ${{ github.workflow }}-${{ github.job }}

      - name: Run CodeQL static analysis
        run: |
          bazel run --config=codeql //quality/static_analysis:codeql_lint -- \
            --output-dir /tmp/codeql-results \
            --output-prefix codeql-pr \
            --target //score/mw/diag/... //tests/cpp:cpp_test_main

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-static-analysis
          path: /tmp/codeql-results/
          if-no-files-found: warn
          retention-days: 7