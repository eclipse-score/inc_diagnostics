name: Documentation Cleanup

permissions:
  contents: write
  pull-requests: read
  pages: write
  id-token: write

on:
  workflow_call:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC

jobs:
  docs-cleanup:
uses: eclipse-score/cicd-workflows/.github/workflows/_docs-cleanup.yml@096f52ab460e52b9cf5d2a89384406385df9c074 # 2026-09-02
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
